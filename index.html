<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMA Premium Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f7f9;
      margin: 0;
      padding: 15px;
    }
    h2 { text-align: center; color: #2c3e50; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      cursor: pointer;
    }
    .card img { width: 100%; height: 100px; object-fit: cover; }
    .card-content { padding: 10px; font-weight: bold; }

    /* --- Ikkinchi oyna (valyuta ro'yxati) --- */
    #currencyScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #f4f7f9;
      padding: 15px;
      overflow-y: auto;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 16px;
      color: #3498db;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .product-row {
      background: white;
      border-radius: 12px;
      padding: 12px 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .product-row .name { font-weight: bold; }
    .product-row .price { color: #27ae60; font-weight: bold; }
    .buy-btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    #loading, #error { text-align: center; margin-top: 30px; color: #888; }
  </style>
</head>
<body>
  <h2>🎮 O'yinni tanlang</h2>
  <div class="grid" id="gamesGrid">
    <!-- O'yin kartalari JS orqali /games so'rovidan keyin chiqariladi -->
  </div>
  <div id="loading">Yuklanmoqda...</div>

  <!-- Ikkinchi oyna: tanlangan o'yinning valyuta paketlari -->
  <div id="currencyScreen">
    <button class="back-btn" onclick="goBack()">← Orqaga</button>
    <h2 id="currencyTitle"></h2>
    <div id="productsList"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // MUHIM: bu yerga bot serveringiz manzilini yozing
    // (masalan Render/Railway'da deploy qilingandan keyingi https:// manzil)
    const API_BASE = "https://SIZNING-BOT-SERVERINGIZ.onrender.com";

    // O'yin kartalari uchun rasm (istalgancha almashtiring)
    const GAME_IMAGES = {
      pubgm: "https://images.unsplash.com/photo-1560253023-3ec5d502959f?w=300",
      brawlstars: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300",
      mlbb: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300",
      freefire: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=300",
    };

    let GAMES = {};

    async function loadGames() {
      try {
        const res = await fetch(`${API_BASE}/games`);
        GAMES = await res.json();
        renderGamesGrid();
        document.getElementById("loading").style.display = "none";
      } catch (e) {
        document.getElementById("loading").textContent =
          "Xatolik: o'yinlar ro'yxatini yuklab bo'lmadi.";
      }
    }

    function renderGamesGrid() {
      const grid = document.getElementById("gamesGrid");
      grid.innerHTML = "";
      for (const key in GAMES) {
        const game = GAMES[key];
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openGame(key);
        card.innerHTML = `
          <img src="${GAME_IMAGES[key] || ""}" />
          <div class="card-content">${game.title}</div>
        `;
        grid.appendChild(card);
      }
    }

    // --- Ikkinchi oynani ochish ---
    function openGame(gameKey) {
      const game = GAMES[gameKey];
      document.getElementById("currencyTitle").textContent =
        `💎 ${game.title} (${game.currency})`;

      const list = document.getElementById("productsList");
      list.innerHTML = "";
      game.products.forEach((p) => {
        const row = document.createElement("div");
        row.className = "product-row";
        row.innerHTML = `
          <span class="name">${p.name}</span>
          <span class="price">$${p.priceUSD}</span>
          <button class="buy-btn">Sotib olish</button>
        `;
        row.querySelector(".buy-btn").onclick = () => buyProduct(p.id);
        list.appendChild(row);
      });

      document.getElementById("currencyScreen").style.display = "block";
    }

    function goBack() {
      document.getElementById("currencyScreen").style.display = "none";
    }

    // Botga faqat productId yuboriladi - narx serverda hal qilinadi
    function buyProduct(productId) {
      tg.sendData(JSON.stringify({ action: "buy_item", productId }));
    }

    loadGames();
  </script>
</body>
</html>
