<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMA Premium Shop 3D</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ASOSIY ANIMATSION FON (Qora, Qizil, Yashil, Ko'k) */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        :root {
            --glass-bg: rgba(20, 20, 20, 0.7);
            --neon-red: #ff003c;
            --neon-green: #00ff66;
            --neon-blue: #00e5ff;
            --text-color: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(-45deg, #0a0a0a, #3a0000, #002b12, #00103a);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* HEADER */
        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 5px 20px rgba(0, 229, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .header h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: -webkit-linear-gradient(45deg, var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 10px rgba(0,255,0,0.3);
        }
        .balance-badge {
            margin-top: 10px;
            display: inline-block;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--neon-green);
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        /* TABS (Menyular) */
        .tabs {
            display: flex;
            justify-content: center;
            margin: 20px 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: gray;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* SECTIONS */
        .section { display: none; padding: 0 15px; animation: fadeIn 0.5s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 3D KARTALAR (TOVARLAR) */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            perspective: 1000px; /* 3D effect uchun muhim */
        }
        .card {
            background: var(--glass-bg);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transform-style: preserve-3d;
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        /* Rangli border effektlari */
        .card:nth-child(odd) { box-shadow: 0 10px 20px rgba(255, 0, 60, 0.15); border-bottom: 3px solid var(--neon-red); }
        .card:nth-child(even) { box-shadow: 0 10px 20px rgba(0, 255, 102, 0.15); border-bottom: 3px solid var(--neon-green); }
        
        .card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 10px;
            transform: translateZ(30px); /* 3D da rasm oldinga chiqadi */
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .card h3 { 
            font-size: 16px; 
            margin-bottom: 5px; 
            transform: translateZ(20px);
        }
        .card p { 
            color: var(--neon-green); 
            font-weight: bold; 
            font-size: 18px; 
            margin-bottom: 15px;
            transform: translateZ(20px);
        }
        .buy-btn {
            background: linear-gradient(90deg, #ff003c, #cc0030);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transform: translateZ(40px); /* 3D tugma eng oldinda */
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.5);
        }
        .buy-btn:active { transform: translateZ(20px) scale(0.95); }

        /* TARIX QISMI */
        .history-item {
            background: var(--glass-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid var(--neon-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* MODAL OYNA (Xaridni tasdiqlash) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal {
            background: linear-gradient(135deg, #111, #222);
            width: 85%; padding: 25px; border-radius: 20px; text-align: center;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
            transform: scale(0.8); transition: 0.3s;
        }
        .modal-overlay.open .modal { transform: scale(1); }
        .modal h2 { margin-bottom: 10px; color: var(--neon-blue); }
        .modal p { margin-bottom: 20px; font-size: 16px; color: #ccc;}
        .modal-buttons { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; }
        .btn-cancel { background: #333; color: white; }
        .btn-confirm { background: var(--neon-green); color: #000; box-shadow: 0 0 15px var(--neon-green); }

    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-gamepad"></i> BMA Premium</h1>
        <div class="balance-badge" id="balanceDisplay"><i class="fa-solid fa-wallet"></i> 0 UZS</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('shop')"><i class="fa-solid fa-store"></i> Do'kon</button>
        <button class="tab-btn" onclick="switchTab('history')"><i class="fa-solid fa-clock-rotate-left"></i> Tarix</button>
    </div>

    <div id="shop" class="section active">
        <div class="grid" id="productsGrid">
            </div>
    </div>

    <div id="history" class="section">
        <h2 style="margin-bottom: 15px; color: var(--neon-blue); text-align: center;">Oxirgi operatsiyalar</h2>
        <div id="historyList">
            </div>
    </div>

    <div class="modal-overlay" id="buyModal">
        <div class="modal">
            <h2>Xaridni tasdiqlang</h2>
            <p id="modalText">Siz rostdan ham ushbu tovarni xarid qilmoqchimisiz?</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal()">Yo'q</button>
                <button class="modal-btn btn-confirm" id="confirmBtn">Ha, sotib olish</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Oynani to'liq ochish

        const API_URL = "https://sening-render-sayting.onrender.com"; // O'ZINGNING RENDER LINKINGNI QO'Y!
        const userId = tg.initDataUnsafe?.user?.id || "123456"; 
        
        let currentBalance = 0;
        let selectedItem = null;

        // Tovarlar bazasi
        const products = [
            { id: 1, name: "PUBG 60 UC", price: 12000, img: "https://e7.pngegg.com/pngimages/681/151/png-clipart-pubg-mobile-uc-coin-thumbnail.png" },
            { id: 2, name: "PUBG 325 UC", price: 60000, img: "https://e7.pngegg.com/pngimages/681/151/png-clipart-pubg-mobile-uc-coin-thumbnail.png" },
            { id: 3, name: "MLBB 86 Olmos", price: 18000, img: "https://w7.pngwing.com/pngs/423/915/png-transparent-mobile-legends-bang-bang-diamond-mobile-phones-gemstone-diamond-game-gemstone-blue-thumbnail.png" },
            { id: 4, name: "Free Fire 100 💎", price: 15000, img: "https://w7.pngwing.com/pngs/391/361/png-transparent-garena-free-fire-diamond-video-game-diamond-game-diamond-logo-thumbnail.png" },
        ];

        // 3D Effekt Mantiq (Telefonni qimirlatganda yoki bosganda)
        function apply3DEffect() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left; // Mouse X
                    const y = e.clientY - rect.top;  // Mouse Y
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    const rotateX = ((y - centerY) / centerY) * -15; // Max 15 deg
                    const rotateY = ((x - centerX) / centerX) * 15;

                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                });
            });
        }

        // Do'konni chizish
        function renderShop() {
            const grid = document.getElementById('productsGrid');
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>${p.price.toLocaleString()} UZS</p>
                        <button class="buy-btn" onclick="openModal('${p.name}', ${p.price})">SOTIB OLISH</button>
                    </div>
                `;
            });
            apply3DEffect();
        }

        // Tablarni almashtirish
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Modal funksiyalari
        function openModal(name, price) {
            selectedItem = { name, price };
            document.getElementById('modalText').innerHTML = `<b>${name}</b> ni <br><span style='color:var(--neon-green); font-size:20px;'>${price.toLocaleString()} UZS</span> ga xarid qilasizmi?`;
            document.getElementById('buyModal').classList.add('open');
            tg.HapticFeedback.impactOccurred('medium'); // Telefonda viz-viz titrash
        }

        function closeModal() {
            document.getElementById('buyModal').classList.remove('open');
        }

        document.getElementById('confirmBtn').addEventListener('click', () => {
            if (currentBalance >= selectedItem.price) {
                // Telegram Botga ma'lumot jo'natish
                tg.sendData(JSON.stringify({ action: "buy_item", item: selectedItem.name, price: selectedItem.price }));
                tg.close(); // Oynani yopish
            } else {
                tg.showAlert("Hisobingizda mablag' yetarli emas! Iltimos botdan /pay orqali to'ldiring.");
                closeModal();
            }
        });

        // Balansni serverdan tortib kelish
        async function fetchUserData() {
            try {
                // DIQQAT: API_URL ni to'g'rilash yodingdan chiqmasin
                const response = await fetch(`${API_URL}/get-user/${userId}`);
                const data = await response.json();
                
                currentBalance = data.balance;
                document.getElementById('balanceDisplay').innerHTML = `<i class="fa-solid fa-wallet"></i> ${currentBalance.toLocaleString()} UZS`;

                const historyList = document.getElementById('historyList');
                if (data.history.length === 0) {
                    historyList.innerHTML = "<p style='text-align:center; color:gray;'>Hali hech qanday tranzaksiya yo'q</p>";
                } else {
                    historyList.innerHTML = data.history.reverse().map(h => `
                        <div class="history-item">
                            <div>
                                <b>${h.status}</b><br>
                                <small style="color:gray;">${h.date}</small>
                            </div>
                            <div style="color: ${h.amount > 0 ? 'var(--neon-green)' : 'var(--neon-red)'}; font-weight:bold;">
                                ${h.amount > 0 ? '+' : ''}${h.amount.toLocaleString()} UZS
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error("Balansni olishda xato:", err);
            }
        }

        // Ishga tushirish
        renderShop();
        fetchUserData();

    </script>
</body>
</html>
