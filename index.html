<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMA Premium Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --bg: #07090f; /* Chuqur qora */
            --card-bg: #10141e; /* Mat qora-ko'k */
            --accent: #00a2ff; /* Sport ko'k */
            --primary: #0055ff; /* To'q ko'k */
            --text: #ffffff; 
            --sub-text: #8b949e; 
            --border: rgba(0, 162, 255, 0.15); 
            --error: #ff3333; 
            --success: #00e676;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Sporty fon */
        .bg-particles { position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 50% 0%, #0d1b2a 0%, var(--bg) 70%); }
        
        .page-content { padding-bottom: 90px; display: none; animation: fadeIn 0.2s ease-out; }
        .page-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .user-card { display: flex; align-items: center; gap: 12px; }
        .user-card img { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--accent); object-fit: cover; box-shadow: 0 0 10px rgba(0, 162, 255, 0.3); }
        .username-badge { font-size: 11px; color: var(--bg); background: var(--accent); padding: 3px 8px; border-radius: 4px; display: inline-block; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Balans kartasi - Klassik va Sport aralashmasi */
        .balance-card { margin: 0 20px; background: linear-gradient(135deg, #0d1b2a, #1b263b); padding: 25px 20px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 8px 25px rgba(0, 85, 255, 0.15); position: relative; overflow: hidden; }
        .balance-card::after { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100%; background: linear-gradient(90deg, transparent, rgba(0, 162, 255, 0.1)); transform: skewX(-45deg); }
        .balance-amount { font-size: 32px; font-weight: 900; margin-top: 5px; font-style: italic; color: #fff; text-shadow: 0 2px 10px rgba(0, 162, 255, 0.5); }
        
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 2000; display: none; align-items: flex-end; }
        .modal-content { background: var(--card-bg); width: 100%; max-height: 90vh; border-radius: 20px 20px 0 0; padding: 25px 20px; border-top: 2px solid var(--primary); animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .timer-badge { background: rgba(255, 51, 51, 0.1); color: var(--error); padding: 6px 16px; border-radius: 8px; font-weight: 900; border: 1px solid var(--error); margin-bottom: 10px; display: inline-block; letter-spacing: 1px; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 20px; }
        .game-card { background: var(--card-bg); border-radius: 12px; padding: 15px; text-align: center; border: 1px solid var(--border); transition: 0.2s; cursor: pointer; position: relative; overflow: hidden; }
        .game-card:active { transform: scale(0.95); border-color: var(--accent); }
        .game-card img { width: 70px; height: 70px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .game-title { font-size: 13px; font-weight: 700; color: #e0e0e0; text-transform: uppercase; }
        
        .history-item { background: var(--card-bg); margin: 10px 20px; padding: 15px; border-radius: 8px; border: 1px solid var(--border); border-left: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: center; }
        
        .main-btn { width: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: 900; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 162, 255, 0.3); }
        .main-btn:active { transform: translateY(2px); box-shadow: none; }
        
        .input-dark { width: 100%; padding: 15px; background: #05070a; border: 1px solid var(--border); color: var(--accent); border-radius: 8px; margin-bottom: 20px; font-size: 18px; font-weight: bold; text-align: center; }
        .input-dark:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 162, 255, 0.2); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(7, 9, 15, 0.95); backdrop-filter: blur(10px); display: flex; padding: 15px 0 20px; border-top: 1px solid var(--border); }
        .nav-item { flex: 1; text-align: center; color: var(--sub-text); font-size: 11px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 18px; }
    </style>
</head>
<body>
    <div class="bg-particles"></div>

    <div id="page-home" class="page-content active">
        <div class="header">
            <div class="user-card">
                <img id="u-ava" src="https://ui-avatars.com/api/?name=U&background=00a2ff&color=fff">
                <div>
                    <div id="u-name" style="font-weight: 900; font-size: 16px; text-transform: uppercase;">Yuklanmoqda...</div>
                    <div class="username-badge" id="u-handle">@username</div>
                </div>
            </div>
            <div onclick="openModal('modal-topup')" style="color: var(--accent); font-weight: 800; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;">
                <i class="fas fa-bolt"></i> To'ldirish
            </div>
        </div>

        <div class="balance-card">
            <div style="font-size: 11px; color: var(--sub-text); text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">Mening hisobim</div>
            <div class="balance-amount"><span id="user-balance">0</span> <span style="font-size: 16px; color: var(--accent); font-style: normal;">UZS</span></div>
        </div>

        <h3 style="padding: 25px 20px 15px; margin: 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: var(--sub-text);">Katalog</h3>
        <div class="grid" id="game-grid"></div>
    </div>

    <div id="page-history" class="page-content">
        <h3 style="padding: 25px 20px 15px; margin: 0; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: var(--sub-text);">Operatsiyalar</h3>
        <div id="history-list">
            <p style="text-align:center; opacity:0.5; margin-top:50px; font-weight: bold; text-transform: uppercase;">Tarix bo'sh</p>
        </div>
    </div>

    <div id="modal-topup" class="modal-bg">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="font-size:18px; margin:0; text-transform: uppercase; font-weight: 900;">Hisobni to'ldirish</h2>
                <i class="fas fa-times" onclick="closeModal('modal-topup')" style="padding:10px; color: var(--sub-text); font-size: 20px;"></i>
            </div>
            <input type="number" id="topup-amount" class="input-dark" value="15000">
            <button class="main-btn" onclick="startPaymentFlow()">To'lovni davom ettirish</button>
        </div>
    </div>

    <div id="modal-instruction" class="modal-bg">
        <div class="modal-content">
            <div style="text-align:center; margin-bottom:20px;">
                <div id="payment-timer" class="timer-badge">05:00</div>
                <h2 style="font-size:16px; margin:0; text-transform: uppercase; font-weight: 900; color: var(--accent);">Yo'riqnoma</h2>
            </div>
            <div style="background:rgba(0, 162, 255, 0.05); padding:20px; border-radius:12px; margin-bottom:20px; border:1px solid var(--border);">
                <div style="font-size:11px; opacity:0.8; text-transform: uppercase; font-weight: bold;">Karta raqami:</div>
                <div style="font-size:20px; font-weight:900; letter-spacing:2px; margin:10px 0; color: #fff; cursor: pointer;" onclick="copyCard('8802502260365472')">
                    8802 5022 6036 5472 <i class="far fa-copy" style="font-size:16px; margin-left:10px; color: var(--accent);"></i>
                </div>
                <div style="font-size:13px; font-weight: bold;">Summa: <b id="display-sum" style="color:var(--accent); font-size: 16px;">0</b> <b>UZS</b></div>
            </div>
            <button id="pay-confirm-btn" class="main-btn" onclick="confirmPayment()">To'lov qildim</button>
            <div id="wait-area" style="display:none; text-align:center; padding:15px;">
                <i class="fas fa-circle-notch fa-spin" style="color:var(--accent); font-size:30px; margin-bottom:15px;"></i>
                <p style="font-size:13px; color:var(--accent); font-weight: bold; text-transform: uppercase;">Admin tasdiqlashini kuting...</p>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('home', this)"><i class="fas fa-gamepad"></i><span>Do'kon</span></div>
        <div class="nav-item" onclick="switchPage('history', this)"><i class="fas fa-list-alt"></i><span>Tarix</span></div>
        <div class="nav-item" onclick="tg.showAlert('Telegram: @BMA_Admin')"><i class="fas fa-user-shield"></i><span>Yordam</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const SERVER_URL = "https://telegram-1-4tqg.onrender.com"; 

        let timeLeft = 300;
        let timerInterval;
        let currentAmount = 0;

        const catalog = [
            { id: 'pubg', name: 'PUBG UC', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6A6R_N431Uf6W9v73MAn_1uT_Q6Wv53vU6A&s' },
            { id: 'ff', name: 'Free Fire', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6_L6q_fX1i4z4O4J-S8y0PZp5Y0f7v3vU6A&s' },
            { id: 'ml', name: 'MLBB', img: 'https://cdn-icons-png.flaticon.com/512/5260/5260498.png' },
            { id: 'tg_prem', name: 'Premium', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Telegram_logo.svg/2048px-Telegram_logo.svg.png' }
        ];

        function initApp() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            catalog.forEach(item => {
                grid.innerHTML += `
                    <div class="game-card" onclick="tg.showAlert('Sotib olish tizimi tez kunda...')">
                        <img src="${item.img}">
                        <div class="game-title">${item.name}</div>
                    </div>`;
            });
            loadUserData();
        }

        function loadUserData() {
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('u-name').innerText = user.first_name || 'Mijoz';
                document.getElementById('u-handle').innerText = user.username ? '@' + user.username : 'ID: ' + user.id;
                if (user.photo_url) document.getElementById('u-ava').src = user.photo_url;

                fetch(`${SERVER_URL}/get-balance/${user.id}`)
                    .then(r => r.json())
                    .then(data => {
                        document.getElementById('user-balance').innerText = (data.balance || 0).toLocaleString();
                        const historyList = document.getElementById('history-list');
                        if(data.history && data.history.length > 0) {
                            historyList.innerHTML = '';
                            data.history.reverse().forEach(item => {
                                historyList.innerHTML += `
                                <div class="history-item">
                                    <div>
                                        <b style="color: var(--accent); font-size: 16px;">+${Number(item.amount).toLocaleString()} UZS</b><br>
                                        <small style="color: var(--sub-text); font-weight: bold;">${item.date}</small>
                                    </div>
                                    <span style="font-size: 11px; background: rgba(0,230,118,0.1); color: var(--success); padding: 4px 8px; border-radius: 4px; font-weight: bold;">${item.status}</span>
                                </div>`;
                            });
                        }
                    })
                    .catch(e => console.error("Fetch error:", e));
            } else {
                setTimeout(loadUserData, 500);
            }
        }

        function switchPage(page, el) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
            el.classList.add('active');
        }

        function startPaymentFlow() {
            const amt = document.getElementById('topup-amount').value;
            if (amt < 1000) return tg.showAlert("Minimal to'lov 1,000 UZS");
            currentAmount = amt;
            document.getElementById('display-sum').innerText = parseInt(amt).toLocaleString();
            closeModal('modal-topup');
            openModal('modal-instruction');
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 300;
            timerInterval = setInterval(() => {
                timeLeft--;
                let min = Math.floor(timeLeft / 60);
                let sec = timeLeft % 60;
                document.getElementById('payment-timer').innerText = `${min < 10 ? '0'+min : min}:${sec < 10 ? '0'+sec : sec}`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    tg.showAlert("Vaqt tugadi!");
                    location.reload();
                }
            }, 1000);
        }

        function confirmPayment() {
            const user = tg.initDataUnsafe?.user;
            document.getElementById('pay-confirm-btn').style.display = 'none';
            document.getElementById('wait-area').style.display = 'block';
            const data = { action: "pay_confirm", amount: currentAmount, user_id: user?.id || 0 };
            tg.sendData(JSON.stringify(data));
        }

        function copyCard(num) {
            navigator.clipboard.writeText(num);
            tg.HapticFeedback.impactOccurred('medium');
            tg.showAlert("Karta nusxalandi!");
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
            if(id === 'modal-instruction') clearInterval(timerInterval);
        }

        initApp();
    </script>
</body>
</html>
